########################### EXTENSION FIELDS
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-restic-env: &restic-env
  TZ: $TZ
  RESTIC_REPOSITORY: b2:$B2_BUCKET:/restic
  RESTIC_PASSWORD_FILE: /run/secrets/restic_password
  B2_ACCOUNT_ID: $B2_ACCOUNT_ID
  B2_ACCOUNT_KEY: $B2_ACCOUNT_KEY

########################### NETWORKS
networks:
  traefik:
    name: traefik
    external: true
  default:
    driver: bridge
  socket-proxy: # read-write Docker API (Watchtower, Portainer)
    name: socket-proxy
    external: true
  socket-proxy-ro: # read-only Docker API (Traefik)
    name: socket-proxy-ro
    internal: true
  internal:
    external: false
  vpn-subnet: # must be recreated on 10.20.10.0/24 - see MIGRATION.md
    name: vpn-subnet
    external: true

########################### SECRETS
secrets:
  cloudflare_dns_api_token:
    file: $SECRETSDIR/cloudflare_dns_api_token
  postgres_root_password:
    file: $SECRETSDIR/postgres_root_password
  postgres_nextcloud_password:
    file: $SECRETSDIR/postgres_nextcloud_password
  postgres_ttrss_password:
    file: $SECRETSDIR/postgres_ttrss_password
  postgres_mealie_password:
    file: $SECRETSDIR/postgres_mealie_password
  pgadmin_default_password:
    file: $SECRETSDIR/pgadmin_default_password
  redis_conf:
    file: $SECRETSDIR/redis.conf
  restic_password:
    file: $SECRETSDIR/restic_password
  watchtower_notification_url:
    file: $SECRETSDIR/watchtower_notification_url

########################### SERVICES
services:
  traefik:
    container_name: traefik
    image: traefik:v3.7 # pinned to a minor: v3 minors change behaviour - read docs/migrate/v3 before bumping
    restart: unless-stopped
    command: # CLI arguments
      - --global.checkNewVersion=true
      - --global.sendAnonymousUsage=false
      - --entryPoints.http.address=:80
      - --entryPoints.http.http.redirections.entryPoint.to=https
      - --entryPoints.http.http.redirections.entryPoint.scheme=https
      - --entryPoints.http.http.aliasHeadersStrategy=delete
      - --entryPoints.https.address=:443
        # Drop headers like X_Auth_User / X.Auth.User that PHP backends would read as X-Auth-User (spoofing)
      - --entryPoints.https.http.aliasHeadersStrategy=delete
        # Allow these IPs to set the X-Forwarded-* headers - Cloudflare IPs: https://www.cloudflare.com/ips/
      - --entrypoints.https.forwardedHeaders.trustedIPs=173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22
      - --entrypoints.https.http.tls.certresolver=dns-cloudflare
        # Wildcard cert for every router on :443 (previously carried by the dashboard router)
      - --entrypoints.https.http.tls.domains[0].main=$DOMAINNAME
      - --entrypoints.https.http.tls.domains[0].sans=*.$DOMAINNAME
      - --api=false # No dashboard or API: this instance is internet-facing
      - --log=true
      - --log.level=WARN # (Default: error) DEBUG, INFO, WARN, ERROR, FATAL, PANIC
      - --accessLog=true
      - --accessLog.filePath=/traefik.log
      - --accessLog.bufferingSize=100 # Configuring a buffer of 100 lines
      - --accessLog.filters.statusCodes=400-499
      - --providers.docker=true
      - --providers.docker.endpoint=tcp://socket-proxy-ro:2375
      - --providers.docker.defaultrule=Host(`{{ index .Labels "com.docker.compose.service" }}.$DOMAINNAME`)
      - --providers.docker.exposedByDefault=false
      - --providers.docker.network=traefik
      - --providers.file.directory=/rules # Load dynamic configuration from one or more .toml or .yml files in a directory.
      - --providers.file.watch=true # Only works on top level files in the rules folder
#      - --certificatesResolvers.dns-cloudflare.acme.caServer=https://acme-staging-v02.api.letsencrypt.org/directory # LetsEncrypt Staging Server - uncomment when testing
      - --certificatesResolvers.dns-cloudflare.acme.email=$CLOUDFLARE_EMAIL
      - --certificatesResolvers.dns-cloudflare.acme.storage=/acme.json
      - --certificatesResolvers.dns-cloudflare.acme.dnsChallenge.provider=cloudflare
      - --certificatesResolvers.dns-cloudflare.acme.dnsChallenge.resolvers=1.1.1.1:53,1.0.0.1:53
      - --certificatesResolvers.dns-cloudflare.acme.dnsChallenge.propagation.delayBeforeChecks=5s
    networks:
      - traefik
      - socket-proxy-ro
    security_opt:
      - no-new-privileges:true
    secrets:
      - cloudflare_dns_api_token
    depends_on:
      - socket-proxy-ro
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: host
      - target: 443
        published: 443
        protocol: tcp
        mode: host
    volumes:
      - $DOCKERDIR/traefik2/rules:/rules
      - $DOCKERDIR/traefik2/acme/acme.json:/acme.json
      - $DOCKERDIR/traefik2/traefik.log:/traefik.log
      - $DOCKERDIR/shared:/shared
    environment:
      - TZ=$TZ
      - CF_DNS_API_TOKEN_FILE=/run/secrets/cloudflare_dns_api_token # Scoped token: Zone:DNS:Edit only
    logging: *default-logging
    # No traefik.* labels: exposedByDefault=false keeps Traefik from routing to itself

  # Read-only Docker API for the internet-facing reverse proxy
  socket-proxy-ro:
    container_name: socket-proxy-ro
    image: tecnativa/docker-socket-proxy:latest
    restart: unless-stopped
    networks:
      - socket-proxy-ro
    security_opt:
      - no-new-privileges:true
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    environment:
      - TZ=$TZ
      - LOG_LEVEL=info # debug,info,notice,warning,err,crit,alert,emerg
      ## EVENTS, PING, VERSION are granted by default; POST is denied by default
      - CONTAINERS=1 # Traefik
    logging: *default-logging

  # Read-write Docker API - NOT exposed on the host; reachable only on the socket-proxy network
  socket-proxy:
    container_name: socket-proxy
    image: tecnativa/docker-socket-proxy:latest
    restart: unless-stopped
    networks:
      - socket-proxy
    security_opt:
      - no-new-privileges:true
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    environment:
      - TZ=$TZ
      - LOG_LEVEL=info # debug,info,notice,warning,err,crit,alert,emerg
      ## Variables match the URL prefix (i.e. AUTH blocks access to /auth/* parts of the API, etc.).
      # 0 to revoke access.
      # 1 to grant access.
      ## Granted by Default
      - EVENTS=1
      - PING=1
      - VERSION=1
      ## Revoked by Default
      # Security critical
      - AUTH=0
      - SECRETS=0
      - POST=1 # Watchtower - allows all non-GET methods on the sections enabled below
      - EXEC=0 # Restic no longer needs docker exec (see pg-backup); disables Portainer's container console
        # GET Options
      - BUILD=0
      - COMMIT=0
      - CONFIGS=0
      - CONTAINERS=1 # Portainer, Watchtower
      - DISTRIBUTION=0
      - IMAGES=1 # Portainer, Watchtower
      - INFO=1 # Portainer
      - NETWORKS=1 # Portainer, Watchtower
      - NODES=0
      - PLUGINS=0
      - SERVICES=1 # Portainer
      - SESSION=0
      - SWARM=0
      - SYSTEM=0
      - TASKS=1 # Portainer
      - VOLUMES=1 # Portainer
    logging: *default-logging

  watchtower:
    container_name: watchtower
    image: nickfedor/watchtower:latest
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - socket-proxy
      - default # internet access for registry checks + Telegram (socket-proxy may be --internal)
    depends_on:
      - socket-proxy
    secrets:
      - watchtower_notification_url
    environment:
      - TZ=$TZ
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_REMOVE_VOLUMES=false # true deletes anonymous volumes when containers are recreated
      - WATCHTOWER_INCLUDE_STOPPED=true
      - WATCHTOWER_NO_STARTUP_MESSAGE=false
      - WATCHTOWER_SCHEDULE=0 0 4 * * * # Everyday at 04:00
      - WATCHTOWER_NOTIFICATIONS=shoutrrr
      - WATCHTOWER_NOTIFICATION_URL=/run/secrets/watchtower_notification_url # Watchtower reads the URL from this file
      - WATCHTOWER_NOTIFICATIONS_LEVEL=info
      - DOCKER_HOST=tcp://socket-proxy:2375
      #- DOCKER_API_VERSION=1.40
    logging: *default-logging

  postgres:
    container_name: postgres
    image: postgres:17-alpine
    restart: unless-stopped
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    secrets:
      - postgres_root_password
    volumes:
      - $DOCKERDIR/postgres:/var/lib/postgresql/data
    environment:
      - TZ=$TZ
      - POSTGRES_USER=$POSTGRES_USER
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_root_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging

  # Logical dumps of each database; picked up by restic from $DOCKERDIR/pgbackups
  pg-backup:
    container_name: pg-backup
    image: prodrigestivill/postgres-backup-local:17-alpine # keep major in step with postgres
    user: postgres:postgres # uid/gid 70 on alpine - chown the backup dir to match
    restart: unless-stopped
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    secrets:
      - postgres_root_password
    volumes:
      - $DOCKERDIR/pgbackups:/backups
    environment:
      - TZ=$TZ
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=nextcloud,wallabag,ttrss,mealie # every database to dump - check with \l
      - POSTGRES_USER=$POSTGRES_USER
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_root_password
      - SCHEDULE=@daily # midnight, ahead of the 02:00 restic backup
      - BACKUP_KEEP_DAYS=7
      - BACKUP_KEEP_WEEKS=4
      - BACKUP_KEEP_MONTHS=6
    logging: *default-logging

  portainer:
    container_name: portainer
    image: portainer/portainer-ce:lts
    restart: unless-stopped
    networks:
      vpn-subnet:
        ipv4_address: 10.20.10.2
      socket-proxy: null
    security_opt:
      - no-new-privileges:true
    depends_on:
      - socket-proxy
    volumes:
      - $DOCKERDIR/portainer:/data
    environment:
      - TZ=$TZ
      - DOCKER_HOST=tcp://socket-proxy:2375
    logging: *default-logging

  pgadmin:
    container_name: pgadmin
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    networks:
      internal: null
      vpn-subnet:
        ipv4_address: 10.20.10.3
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    secrets:
      - pgadmin_default_password
    volumes:
      - $DOCKERDIR/pgadmin:/var/lib/pgadmin
    environment:
      - TZ=$TZ
      - PGADMIN_DEFAULT_EMAIL=$PERSONAL_EMAIL
      - PGADMIN_DEFAULT_PASSWORD_FILE=/run/secrets/pgadmin_default_password
      - PGADMIN_LISTEN_PORT=5050
    logging: *default-logging

  wallabag:
    container_name: wallabag
    image: wallabag/wallabag:2.6.14 # pinned; bump deliberately after reading release notes
    restart: unless-stopped
    networks:
      - traefik
      - internal
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    volumes:
      - $DOCKERDIR/wallabag/images:/var/www/wallabag/web/assets/images
      - $DOCKERDIR/wallabag/data:/var/www/wallabag/data
    environment:
      - TZ=$TZ
      - PUID=$PUID
      - PGID=$PGID
      - SYMFONY__ENV__DATABASE_DRIVER=pdo_pgsql
      - SYMFONY__ENV__DATABASE_HOST=postgres
      - SYMFONY__ENV__DATABASE_PORT=5432
      - SYMFONY__ENV__DATABASE_NAME=wallabag
      - SYMFONY__ENV__DATABASE_USER=wallabag
      - SYMFONY__ENV__DATABASE_PASSWORD=$POSTGRES_WALLA_PASSWORD # image has no *_FILE support
      - SYMFONY__ENV__SECRET=$WALLA_SECRET
      - SYMFONY__ENV__DOMAIN_NAME=https://walla.$DOMAINNAME
      - SYMFONY__ENV__REDIS_HOST=redis
      - SYMFONY__ENV__REDIS_PASSWORD=$REDIS_PASSWORD
      - SYMFONY__ENV__FOSUSER_REGISTRATION=false
      - POPULATE_DATABASE=False
    logging: *default-logging
    labels:
      - traefik.enable=true
      ## HTTP Routers
      - traefik.http.routers.wallabag.entrypoints=https
      - traefik.http.routers.wallabag.rule=Host(`walla.$DOMAINNAME`)
      - traefik.http.routers.wallabag.tls=true
      ## Middlewares
      - traefik.http.routers.wallabag.middlewares=chain-no-auth@file
      ## HTTP Services
      - traefik.http.routers.wallabag.service=wallabag-svc
      - traefik.http.services.wallabag-svc.loadbalancer.server.port=80

  nextcloud:
    container_name: nextcloud
    image: nextcloud:35-apache # pin to the major you are on; upgrade one major at a time
    restart: unless-stopped
    networks:
      - traefik
      - internal
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - $DOCKERDIR/nextcloud:/var/www/html
      - $DOCKERDIR/nextcloud-php/changes.ini:/usr/local/etc/php/conf.d/changes.ini:ro # kept outside the web root
    secrets:
      - postgres_nextcloud_password
    environment:
      - TZ=$TZ
      - POSTGRES_DB=nextcloud
      - POSTGRES_USER=nextcloud
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_nextcloud_password
      - POSTGRES_HOST=postgres
      - NEXTCLOUD_TRUSTED_DOMAINS=nextcloud.$DOMAINNAME
      - TRUSTED_PROXIES=${TRAEFIK_SUBNET:-10.10.20.0/24} # must match `docker network inspect traefik`
      - OVERWRITEPROTOCOL=https
      - OVERWRITECLIURL=https://nextcloud.$DOMAINNAME
      - REDIS_HOST=redis
      - REDIS_HOST_PASSWORD=$REDIS_PASSWORD
    logging: *default-logging
    labels:
      - "traefik.enable=true"
      ## HTTP Routers
      - "traefik.http.routers.nextcloud-rtr.entrypoints=https"
      - "traefik.http.routers.nextcloud-rtr.rule=Host(`nextcloud.$DOMAINNAME`)"
      - "traefik.http.routers.nextcloud-rtr.tls=true"
      ## Middlewares
      - "traefik.http.routers.nextcloud-rtr.middlewares=nextcloud-dav,chain-no-auth@file"
      - "traefik.http.middlewares.nextcloud-dav.redirectregex.permanent=true"
      - "traefik.http.middlewares.nextcloud-dav.redirectregex.regex=^https://(.*)/.well-known/(?:card|cal)dav"
      - "traefik.http.middlewares.nextcloud-dav.redirectregex.replacement=https://$${1}/remote.php/dav"
      ## HTTP Services
      - "traefik.http.routers.nextcloud-rtr.service=nextcloud-svc"
      - "traefik.http.services.nextcloud-svc.loadbalancer.server.port=80"
      ## Nextcloud cannot skip majors - update manually
      - "com.centurylinklabs.watchtower.monitor-only=true"

  nextcloud-cron:
    container_name: nextcloud-cron
    image: nextcloud:35-apache # must match the nextcloud service
    entrypoint: /cron.sh
    restart: unless-stopped
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    depends_on:
      - nextcloud
    volumes:
      - $DOCKERDIR/nextcloud:/var/www/html
    environment:
      - TZ=$TZ
    logging: *default-logging
    labels:
      - "com.centurylinklabs.watchtower.monitor-only=true"

  wireguard:
    container_name: wireguard
    image: linuxserver/wireguard:latest
    restart: unless-stopped
    networks:
      vpn-subnet:
        ipv4_address: 10.20.10.5
    volumes:
      - $DOCKERDIR/wireguard:/config
    ports:
      - 51820:51820/udp
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    cap_add:
      - NET_ADMIN # SYS_MODULE + /lib/modules not needed on kernels >= 5.6 (WireGuard built in)
    security_opt:
      - no-new-privileges:true
    environment:
      - TZ=$TZ
      - PUID=$PUID
      - PGID=$PGID
      - SERVERURL=wireguard.$DOMAINNAME # DNS-only (grey cloud) in Cloudflare - UDP can't be proxied
      - SERVERPORT=51820
      - PEERS=2
      - PEERDNS=auto
      - INTERNAL_SUBNET=10.13.14.0
    logging: *default-logging

  app:
    container_name: ttrss-app
    image: supahgreg/tt-rss:latest
    restart: unless-stopped
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    dns:
      - 1.1.1.1
      - 9.9.9.9
    secrets:
      - postgres_ttrss_password
    volumes:
      - $DOCKERDIR/ttrss:/var/www/html
    environment:
      - TZ=$TZ
      - TTRSS_DB_HOST=postgres
      - TTRSS_DB_NAME=ttrss
      - TTRSS_DB_USER=ttrss
      - TTRSS_DB_PASS__FILE=/run/secrets/postgres_ttrss_password # note: double underscore
      - TTRSS_SELF_URL_PATH=https://feed.$DOMAINNAME/
      - APP_BASE= # read by the nginx_xaccel plugin; must match the ttrss (nginx) service
    logging: *default-logging

  ttrss-updater:
    container_name: ttrss-updater
    image: supahgreg/tt-rss:latest
    restart: unless-stopped
    networks:
      - internal
    depends_on:
      - app
    security_opt:
      - no-new-privileges:true
    dns:
      - 1.1.1.1
      - 9.9.9.9
    secrets:
      - postgres_ttrss_password
    volumes:
      - $DOCKERDIR/ttrss:/var/www/html
    environment:
      - TZ=$TZ
      - TTRSS_DB_HOST=postgres
      - TTRSS_DB_NAME=ttrss
      - TTRSS_DB_USER=ttrss
      - TTRSS_DB_PASS__FILE=/run/secrets/postgres_ttrss_password # note: double underscore
      - TTRSS_SELF_URL_PATH=https://feed.$DOMAINNAME/
    command: /opt/tt-rss/updater.sh
    logging: *default-logging

  ttrss:
    container_name: ttrss
    image: supahgreg/tt-rss-web-nginx:latest
    restart: unless-stopped
    networks:
      - traefik
      - internal
    depends_on:
      - app
    security_opt:
      - no-new-privileges:true
    volumes:
      - $DOCKERDIR/ttrss:/var/www/html:ro
#      - $DOCKERDIR/ttrss-nginx.conf.template:/etc/nginx/templates/nginx.conf.template
    environment:
      - TZ=$TZ
      # Serve tt-rss at the site root instead of /tt-rss/
      - APP_WEB_ROOT=/var/www/html/tt-rss
      - APP_BASE=
    logging: *default-logging
    labels:
      - "traefik.enable=true"
      ## HTTP Routers
      - "traefik.http.routers.ttrss-rtr.entrypoints=https"
      - "traefik.http.routers.ttrss-rtr.rule=Host(`feed.$DOMAINNAME`)"
      - "traefik.http.routers.ttrss-rtr.tls=true"
      ## Middlewares
      - "traefik.http.routers.ttrss-rtr.middlewares=ttrss-legacy-path,chain-no-auth@file"
      - "traefik.http.middlewares.ttrss-legacy-path.redirectregex.permanent=true"
      - "traefik.http.middlewares.ttrss-legacy-path.redirectregex.regex=^https://([^/]+)/tt-rss(?:/(.*))?$$"
      - "traefik.http.middlewares.ttrss-legacy-path.redirectregex.replacement=https://$${1}/$${2}"
      ## HTTP Services
      - "traefik.http.routers.ttrss-rtr.service=ttrss-svc"
      - "traefik.http.services.ttrss-svc.loadbalancer.server.port=80"

