#      - "traefik.http.routers.vaultwarden-ws-rtr.service=vaultwarden-ws-svc"
#      - "traefik.http.services.vaultwarden-ws-svc.loadbalancer.server.port=3012"

  redis:
    container_name: redis
    image: redis:8-alpine
    command: ["redis-server", "/run/secrets/redis_conf"] # password lives in redis.conf, not on the command line
    restart: unless-stopped
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    secrets:
      - redis_conf
    volumes:
      - $DOCKERDIR/redis:/data
    environment:
      - TZ=$TZ
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -qE 'PONG|NOAUTH'"] # NOAUTH still proves the server is up
      interval: 30s
      timeout: 5s
      retries: 5
    logging: *default-logging

  # Backs up all of $DOCKERDIR (incl. pg-backup dumps). No Docker socket access needed.
  restic:
    container_name: restic
    image: mazzolino/restic:latest
    restart: unless-stopped
    networks:
      - default
    security_opt:
      - no-new-privileges:true
    secrets:
      - restic_password
    volumes:
      - $DOCKERDIR:/source/data:ro
    environment:
      <<: *restic-env
      RUN_ON_STARTUP: "true"
      BACKUP_CRON: "0 0 2 * * *"
      RESTIC_BACKUP_SOURCES: /source
      # Live Postgres files aren't crash-consistent; the pg-backup dumps are what we restore from
      RESTIC_BACKUP_ARGS: >-
        --verbose
        --exclude /source/data/postgres
      RESTIC_FORGET_ARGS: >-
        --keep-last 10
        --keep-daily 7
        --keep-weekly 5
        --keep-monthly 12
      #POST_COMMANDS_SUCCESS: 'curl -i -X GET ''https://api.telegram.org/bot$RESTIC_TGRAM_TOKEN/sendMessage?chat_id=$RESTIC_TGRAM_CHAT_ID&text=Restic-Backup-Success'''
      POST_COMMANDS_FAILURE: 'curl -i -X GET ''https://api.telegram.org/bot$RESTIC_TGRAM_TOKEN/sendMessage?chat_id=$RESTIC_TGRAM_CHAT_ID&text=$DOMAINNAME-Restic-Backup-Failed'''
    logging: *default-logging

  restic-prune:
    container_name: restic-prune
    image: mazzolino/restic:latest
    restart: unless-stopped
    networks:
      - default
    security_opt:
      - no-new-privileges:true
    secrets:
      - restic_password
    environment:
      <<: *restic-env
      RUN_ON_STARTUP: "false"
      PRUNE_CRON: "0 0 7 * * *"
      #POST_COMMANDS_SUCCESS: 'curl -i -X GET ''https://api.telegram.org/bot$RESTIC_TGRAM_TOKEN/sendMessage?chat_id=$RESTIC_TGRAM_CHAT_ID&text=Restic-Prune-Success'''
      POST_COMMANDS_FAILURE: 'curl -i -X GET ''https://api.telegram.org/bot$RESTIC_TGRAM_TOKEN/sendMessage?chat_id=$RESTIC_TGRAM_CHAT_ID&text=$DOMAINNAME-Restic-Prune-Failed'''
    logging: *default-logging

  restic-check:
    container_name: restic-check
    image: mazzolino/restic:latest
    restart: unless-stopped
    networks:
      - default
    security_opt:
      - no-new-privileges:true
    secrets:
      - restic_password
    environment:
      <<: *restic-env
      RUN_ON_STARTUP: "false"
      CHECK_CRON: "0 15 10 * * *"
      RESTIC_CHECK_ARGS: >-
        --read-data-subset=10%
      #POST_COMMANDS_SUCCESS: 'curl -i -X GET ''https://api.telegram.org/bot$RESTIC_TGRAM_TOKEN/sendMessage?chat_id=$RESTIC_TGRAM_CHAT_ID&text=Restic-Check-Success'''
      POST_COMMANDS_FAILURE: 'curl -i -X GET ''https://api.telegram.org/bot$RESTIC_TGRAM_TOKEN/sendMessage?chat_id=$RESTIC_TGRAM_CHAT_ID&text=$DOMAINNAME-Restic-Check-Failed'''
    logging: *default-logging

  mealie:
    container_name: mealie
    image: hkotel/mealie:latest # actively maintained (v3.x); no floating major tag published
    restart: unless-stopped
    networks:
      - traefik
      - internal
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - $DOCKERDIR/mealie/mealie-data:/app/data
    security_opt:
      - no-new-privileges:true
    secrets:
      - postgres_mealie_password
    environment:
      - TZ=$TZ
      - PUID=$PUID
      - PGID=$PGID
      - ALLOW_SIGNUP=false
      - BASE_URL=https://mealie.$DOMAINNAME
      # Database Settings
      - DB_ENGINE=postgres
      - POSTGRES_USER=mealie
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_mealie_password
      - POSTGRES_SERVER=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=mealie
    logging: *default-logging
    labels:
      - "traefik.enable=true"
      ## HTTP Routers
      - "traefik.http.routers.mealie-rtr.entrypoints=https"
      - "traefik.http.routers.mealie-rtr.rule=Host(`mealie.$DOMAINNAME`)"
      - "traefik.http.routers.mealie-rtr.tls=true"
      ## Middlewares
      - "traefik.http.routers.mealie-rtr.middlewares=chain-no-auth@file"
      ## HTTP Services
      - "traefik.http.routers.mealie-rtr.service=mealie-svc"
      - "traefik.http.services.mealie-svc.loadbalancer.server.port=9000"
